.coins{font:700 19px 'Barlow Condensed',sans-serif;color:var(--gold)}.mut{color:var(--mut)}
nav{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap}

nav button.on{background:var(--gold);color:#1a1503;border-color:var(--gold)}
main{padding:8px 16px 40px;max-width:900px;margin:auto}
h2{font-size:26px;margin:14px 0 8px}h3{font-size:18px;margin:8px 0 4px;color:var(--mut)}

button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pack{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;text-align:center}
.pk{height:100px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font:800 26px 'Barlow Condensed';color:#1a1503;transform:rotate(-3deg);padding:0 6px}
.pack p{margin:4px 0 8px;color:var(--mut);font-size:14px;min-height:36px}

function wkStart(d=new Date()){const s=new Date(d.getFullYear(),d.getMonth(),d.getDate(),15,0,0,0);s.setDate(s.getDate()-((d.getDay()-6+7)%7));if(s>d)s.setDate(s.getDate()-7);return s}
const wk=()=>wkStart().getTime(),wkNext=()=>{const s=wkStart();s.setDate(s.getDate()+7);return s.getTime()};
const tlong=ms=>{const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);const u=UN[CURL]||UN.sv;return(d?d+' '+u[0]+' ':'')+h+' '+u[1]+' '+m+' '+u[2]};
const srng=sd=>()=>{sd=(sd+0x6D2B79F5)|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function give(rs){rs.forEach(r=>{if(r.t==='coins')S.coins+=r.a;else if(r.t==='pack'){for(let i=0;i<r.q;i++)S.packs.push(r.n)}else{const k=r.k==='rand'?pk(['futties','totw','hero','star','mast']):r.k;S.club.push(mkc(pk(POS),rnd(r.min,r.max),k))}});save()}
const dsc=r=>r.t==='coins'?'🪙 '+fmt(r.a):r.t==='pack'?r.q+'× '+r.n:'Spelare '+r.min+(r.max>r.min?'–'+r.max:'')+(r.k?' (special)':'');
const RT={2:[{t:'coins',a:50000},{t:'pack',n:'Guldpack',q:3},{t:'player',min:84,max:88}],3:[{t:'coins',a:100000},{t:'pack',n:'Elitpack',q:2},{t:'player',min:88,max:91},{t:'player',min:85,max:88}],4:[{t:'coins',a:200000},{t:'pack',n:'Superelitpack',q:1},{t:'pack',n:'Hjältepack',q:1},{t:'player',min:92,max:95,k:'rand'},{t:'player',min:88,max:91}]};
const R5=[{t:'coins',a:300000},{t:'pack',n:'Futties-pack',q:1},{t:'pack',n:'Ikonpack',q:1},{t:'player',min:94,max:96,k:'star'}];
const OT=[{id:'w3',t:'Gör 12 mål på 3 matcher i rad',ty:'win',N:3,g:12,tr:2},{id:'w5',t:'Gör 20 mål på 5 matcher i rad',ty:'win',N:5,g:20,tr:3},{id:'w2',t:'Gör 8 mål på 2 matcher i rad',ty:'win',N:2,g:8,tr:4},
{id:'s7',t:'Vinn 7 matcher i rad',ty:'str',g:7,tr:3},{id:'s10',t:'Vinn 10 matcher i rad',ty:'str',g:10,tr:4},
{id:'sb12',t:'Vinn 12 Squad Battles-matcher i Div 6 eller högre',ty:'cnt',k:'sbh',g:12,tr:3},{id:'on8',t:'Vinn 8 online-matcher',ty:'cnt',k:'onw',g:8,tr:3},
{id:'cs6',t:'Håll nollan 6 gånger',ty:'cnt',k:'cs',g:6,tr:2},{id:'big4',t:'Vinn med minst 4 mål 4 gånger',ty:'cnt',k:'big',g:4,tr:3},{id:'op25',t:'Öppna 25 pack',ty:'cnt',k:'open',g:25,tr:2},
{id:'dr3',t:'Vinn alla 4 matcher i Draft 3 gånger',ty:'cnt',k:'draft',g:3,tr:3},{id:'sl6',t:'Sälj 6 kort på marknaden',ty:'cnt',k:'sold',g:6,tr:2},
{id:'ch10',t:'Vinn 10 Champions-matcher',ty:'cnt',k:'chw',g:10,tr:4},{id:'gl80',t:'Gör 80 mål totalt',ty:'cnt',k:'goals',g:80,tr:2},{id:'w30',t:'Vinn 30 matcher',ty:'cnt',k:'wins',g:30,tr:3}];
let _wo=null;
function weekObjs(){const w=wk();if(_wo&&_wo.w===w)return _wo.l;const R=srng(Math.floor(w/1000)),a=[...OT];for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 const l=a.slice(0,8).sort((x,y)=>x.tr-y.tr);l.push({id:'meta',t:'Slutför 5 av veckans 8 mål',ty:'meta',g:5,tr:5});_wo={w,l};return l}
function obS(){const w=wk();if(!S.ob||S.ob.w!==w)S.ob={w,c:{},d:{},p:{cnt:{},str:0,smax:0,last:[],best:{}}};return S.ob}
const prog=ob=>{const o=obS(),p=o.p;return ob.ty==='cnt'?(p.cnt[ob.k]||0):ob.ty==='str'?(p.smax||0):ob.ty==='win'?(p.best[ob.N]||0):weekObjs().filter(x=>x.ty!=='meta'&&o.d[x.id]).length};
function track(ev){const o=obS(),p=o.p,inc=(k,n=1)=>{p.cnt[k]=(p.cnt[k]||0)+n};
 if(ev.open)inc('open',ev.open);if(ev.draft===4)inc('draft');if(ev.sold)inc('sold',ev.sold);
 if(ev.gf!==undefined){inc('goals',ev.gf);
  if(ev.win){inc('wins');p.str=(p.str||0)+1;p.smax=Math.max(p.smax||0,p.str);if(ev.ga===0)inc('cs');if(ev.gf-ev.ga>=4)inc('big');if(ev.gm==='on')inc('onw');if(ev.gm==='sb'&&ev.dv>=4)inc('sbh');if(ev.gm==='ch')inc('chw')}else p.str=0;
  p.last=[...(p.last||[]),ev.gf].slice(-5);[2,3,5].forEach(N=>{if(p.last.length>=N)p.best[N]=Math.max(p.best[N]||0,p.last.slice(-N).reduce((a,b)=>a+b,0))})}
 weekObjs().forEach(ob=>{if(!o.d[ob.id]&&prog(ob)>=ob.g)o.d[ob.id]=1});save()}
const claimable=()=>{const o=obS();return weekObjs().some(ob=>o.d[ob.id]&&!o.c[ob.id])};
function claim(id){const ob=weekObjs().find(x=>x.id===id),o=obS();if(!ob||!o.d[id]||o.c[id])return;o.c[id]=1;const rs=ob.ty==='meta'?R5:RT[ob.tr];give(rs);MSG='Belöning hämtad: '+rs.map(dsc).join(', ');save();render()}
function vObj(){const o=obS(),L=weekObjs();
 return `<h2>Mål</h2><p class="mut">Veckans mål är riktigt svåra och nollställs varje lördag 15:00 (om ${tlong(wkNext()-Date.now())}). Ohämtade belöningar försvinner då. Vunna pack hamnar under "Dina pack" i Butiken.</p>${MSG?`<p class="w">${MSG}</p>`:''}${L.map(ob=>{const pr=Math.min(ob.g,prog(ob)),done=!!o.d[ob.id],cl=!!o.c[ob.id],rs=ob.ty==='meta'?R5:RT[ob.tr];
  return `<div class="ob ${done?'dn':''}"><b>${ob.t}</b><div class="bar"><i style="width:${100*pr/ob.g}%"></i></div><span class="mut">${pr}/${ob.g}</span><div class="rw">${rs.map(r=>`<span>${dsc(r)}</span>`).join('')}</div>${cl?'<span class="w">Hämtad</span>':`<button class="btn" ${done?'':'disabled'} data-c="claim" data-a='["${ob.id}"]'>Hämta belöning</button>`}</div>`}).join('')}`}
/* ---- transfermarknad ---- */
const MD=[['5 min',3e5],['30 min',18e5],['2 tim',72e5]];
const tl=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return s>=3600?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let MK=[],MKready=false,G=new Set(),LST=null,MF='all',MSG='';
const mdoc=id=>DB.doc('market/'+id),del=id=>mdoc(id).delete().catch(()=>{});
function subMarket(){DB.collection('market').onSnapshot(snap=>{MK=snap.docs.map(d=>d.data()).filter(Boolean);MKready=true;settle();const a=document.activeElement;if(view==='market')rr()},()=>{})}
function wr(id,patch,after){if(G.has(id))return;G.add(id);mdoc(id).update(patch).then(()=>{if(after)after()}).catch(()=>{}).finally(()=>G.delete(id))}
function settle(){if(!DB||!U||!MKready)return;const now=Date.now();
 for(const d of MK){if(G.has(d.id))continue;const mine=d.seller===U;
  if(d.sold){
   if(d.sellerPaid&&d.buyerGot){if(mine||d.buyer===U)del(d.id);continue}
   if(mine&&!d.sellerPaid){if(!S.paid[d.id]){S.paid[d.id]=1;S.coins+=Math.round(d.price*.95);MSG='Ett av dina kort såldes för 🪙 '+fmt(d.price)+'.';track({sold:1});save();rr()}wr(d.id,{sellerPaid:true});continue}
   if(d.buyer===U&&!d.buyerGot){if(!S.got[d.id]){S.got[d.id]=1;S.club.push(d.card);delete S.bids[d.id];MSG='Du vann ett kort på marknaden!';save();rr()}wr(d.id,{buyerGot:true});continue}
   continue}
  if(now>d.ends){
   if(d.bidder&&(mine||d.bidder===U)){wr(d.id,{sold:true,buyer:d.bidder,price:d.bid,buyerGot:false,sellerPaid:false});continue}
   if(!d.bidder&&mine){if(!S.got['x'+d.id]){S.got['x'+d.id]=1;S.club.push(d.card);MSG='Ett kort sålde inte och är tillbaka i klubben.';save();rr()}del(d.id)}}}
 for(const id of Object.keys(S.bids)){const d=MK.find(x=>x.id===id);if(!d||(d.sold?d.buyer!==U:d.bidder!==U)){S.coins+=S.bids[id];delete S.bids[id];save();rr()}}}
function bid(id){const d=MK.find(x=>x.id===id),el=document.getElementById('bid_'+id);if(!d||!U||!el||G.has(id))return;
 const a=Math.round(+el.value),min=Math.max(d.start,d.bidder?Math.ceil(d.bid*1.05):0),old=S.bids[id]||0;
 if(d.sold||Date.now()>d.ends)MSG='Annonsen är avslutad.';
 else if(!(a>=min))MSG='Minsta bud är 🪙 '+fmt(min)+'.';
 else if(a-old>S.coins)MSG='Du har inte råd.';
 else if(a>=d.buy)return buyNow(id);
 else{wr(id,{bid:a,bidder:U,bname:(S.user||'Manager-'+U.slice(0,4))},()=>{S.coins-=a-(S.bids[id]||0);S.bids[id]=a;MSG='Bud lagt: 🪙 '+fmt(a);save();render()});return}
 render()}
function buyNow(id){const d=MK.find(x=>x.id===id);if(!d||!U||G.has(id))return;const old=S.bids[id]||0;
 if(d.seller===U||d.sold||Date.now()>d.ends){MSG='Annonsen är avslutad.';render();return}
 if(d.buy-old>S.coins){MSG='Du har inte råd.';render();return}
 G.add(id);mdoc(id).update({sold:true,buyer:U,price:d.buy,buyerGot:false,sellerPaid:false}).then(()=>mdoc(id).get()).then(sn=>{const x=sn.data();
  if(x&&x.sold&&x.buyer===U){S.coins-=d.buy-old;delete S.bids[id];if(!S.got[id]){S.got[id]=1;S.club.push(x.card)}MSG='Köpt för 🪙 '+fmt(d.buy)+'!';save();render();return mdoc(id).update({buyerGot:true})}
  MSG='Någon hann före dig.';render()}).catch(()=>{MSG='Köpet misslyckades.';render()}).finally(()=>G.delete(id))}
function lstOpen(id){const c=S.club.find(x=>x.id===id);if(!c)return;const r=n=>Math.max(100,Math.round(n/100)*100);LST={id,start:r(val(c)*.8),buy:r(val(c)*1.2),dur:18e5};render();scrollTo(0,0)}
function lstForm(){if(!LST)return '';const c=S.club.find(x=>x.id===LST.id);if(!c){LST=null;return ''}
 return `<div class="board" style="text-align:left;margin-bottom:12px"><h3>Lägg ut ${c.n} (${c.r})</h3><div class="cards" style="justify-content:flex-start">${card(c)}<div class="li"><span class="mut">Värde 🪙${fmt(val(c))}</span><label>Startbud <input id="l_start" type="number" min="100" value="${LST.start}" data-h="lstSet" data-a='["start"]'></label><label>Köp nu-pris <input id="l_buy" type="number" min="100" value="${LST.buy}" data-h="lstSet" data-a='["buy"]'></label><label>Tid <select id="l_dur" data-h="lstSet" data-a='["dur"]'>${MD.map(([t,ms])=>`<option value="${ms}" ${LST.dur===ms?'selected':''}>${t}</option>`).join('')}</select></label><span class="mut">Du får 95 % när kortet säljs.</span>${LST.err?`<span class="l">${LST.err}</span>`:''}<div class="row"><button class="btn" ${DB&&U?'':'disabled'} data-c="listCard">Lägg ut</button><button class="btn g" data-c="lstCancel">Avbryt</button></div>${DB&&U?'':'<span class="mut">Marknaden kräver inloggning.</span>'}</div></div></div>`}
function listCard(){const L=LST,c=L&&S.club.find(x=>x.id===L.id);if(!c||!DB||!U||G.has('new'))return;
 const st=Math.max(100,Math.round(+L.start)||0),by=Math.max(st,Math.round(+L.buy)||0),id=U.slice(0,6)+'_'+Date.now();G.add('new');
 mdoc(id).set({id,seller:U,sname:(S.user||'Manager-'+U.slice(0,4)),card:c,start:st,buy:by,bid:0,bidder:null,bname:'',ends:Date.now()+L.dur,sold:false})
 .then(()=>{S.club=S.club.filter(x=>x.id!==c.id);save();LST=null;MF='mine';view='market';MSG='Kortet är utlagt.';render()}).catch(()=>{L.err='Det gick inte att lägga ut kortet.';render()}).finally(()=>G.delete('new'))}
function withdraw(id){const d=MK.find(x=>x.id===id);if(!d||d.bidder||d.seller!==U||G.has(id))return;G.add(id);
 mdoc(id).get().then(sn=>{const x=sn.data();if(!x||x.bidder||x.sold)throw 0;return mdoc(id).delete()}).then(()=>{S.club.push(d.card);MSG='Annonsen är borttagen.';save();render()}).catch(()=>{MSG='Går inte att dra tillbaka (någon har budat).';render()}).finally(()=>G.delete(id))}
function npcList(){const b=Math.floor(Date.now()/12e5);let sd=(b*2654435761)>>>0;const R=()=>{sd=(sd+0x6D2B79F5)|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const o=Math.random,out=[];Math.random=R;try{for(let i=0;i<10;i++){const r=i<2?rnd(93,99):rnd(78,95),k=R()<.3?pk(['futties','totw','hero','icon','star','mast']):undefined,c=mkc(pk(POSM),r,k);c.id='npc'+b+'_'+i;
  out.push({id:c.id,npc:1,card:c,buy:Math.max(100,Math.round(val(c)*(1.05+R()*.35)/100)*100),seller:'bot',sname:'Marknadsbot',ends:(b+1)*12e5})}}finally{Math.random=o}
 return out.filter(x=>!S.npcB[x.id])}
function buyNpc(id){const d=npcList().find(x=>x.id===id);if(!d||S.coins<d.buy)return;S.coins-=d.buy;S.club.push(d.card);S.npcB[id]=1;MSG='Köpt av Marknadsbot för 🪙 '+fmt(d.buy)+'!';save();render()}

setInterval(()=>{document.querySelectorAll('.tl').forEach(e=>{e.textContent=tl(+e.dataset.e-Date.now())});document.querySelectorAll('.cd').forEach(e=>{e.textContent=Math.max(0,Math.ceil((+e.dataset.e-Date.now())/1000))})},1000);

const H={autoSq,bid,buy,buyNow,buyNpc,cancelSearch,chClaim,chEnd,choose,claim,closeP,closePick,cv,dEnd,dform,findCh,findM,flipC,foundGo,gm,listCard,lstCancel,lstOpen,lstSet,nav,nextP,o2,openAll,openStored,pick,pickD,pickLang,pickLater,playD,put,qty,resumePicks,sell,setForm,setLang,setMF,setSpd,setSrc,skip,startD,startGame,toClub,toMenu,togglePause,unpick,vsBot,withdraw};
